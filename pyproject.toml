[project]
name = "brasamiga"
version = "0.1.0"
description = "Landing page e painel admin do Brasamiga, buffet de churrasco"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=11",
    "pillow-heif>=1.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
