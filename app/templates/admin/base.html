<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block titulo %}Painel{% endblock %} · Brasamiga</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <header class="barra">
    <a href="/admin" class="barra-marca">Brasamiga · painel</a>
    <a href="/" target="_blank" rel="noopener">Ver o site</a>
  </header>
  <main class="pagina">
    {% block conteudo %}{% endblock %}
  </main>
  <script>
    // Avisa que o envio pode demorar (vídeos são convertidos no servidor).
    document.querySelectorAll("form[enctype='multipart/form-data']").forEach((form) => {
      form.addEventListener("submit", () => {
        const botao = form.querySelector("button[type=submit]");
        if (botao) { botao.disabled = true; botao.textContent = "Enviando e convertendo…"; }
      });
    });
    // Caixa de entrada: marcar todas / nenhuma.
    document.querySelectorAll("[data-marcar]").forEach((botao) => {
      botao.addEventListener("click", () => {
        botao.closest("form").querySelectorAll("input[name=arquivos]").forEach((caixa) => {
          caixa.checked = botao.dataset.marcar === "todas";
        });
      });
    });
  </script>
</body>
</html>
